name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          curl -sS -m 30 "https://www.youtube.com/feeds/videos.xml?channel_id=UCooVYzDxdwTtGYAkcPmOgOw" -o feed.xml
          python3 - <<'PY'
          import re,subprocess
          x=open('feed.xml').read()
          entries=re.findall(r'<entry>.*?</entry>',x,re.S)
          n=0
          for e in entries:
              vid=re.search(r'<yt:videoId>(.*?)<',e).group(1); link=re.search(r'href="(.*?)"',e).group(1)
              title=re.search(r'<title>(.*?)<',e).group(1)
              short='/shorts/' in link
              print(vid, 'SHORT' if short else 'LONG', title)
              if short or n>=5: continue
              n+=1
              for f in ['maxres1','maxres2','maxres3','hq1','hq2','hq3']:
                  out=f'probe/{vid}-{f}.jpg'
                  r=subprocess.run(['curl','-sS','-m','20','-o',out,'-w','%{http_code} %{size_download}',f'https://i.ytimg.com/vi/{vid}/{f}.jpg'],capture_output=True,text=True)
                  print('  ',f,r.stdout)
          PY
          ls -la probe | head -40
      - run: |
          git config user.name channel-bot; git config user.email channel-bot@users.noreply.github.com
          git checkout -b probe-frames; git add probe; git commit -qm probe; git push -f origin probe-frames

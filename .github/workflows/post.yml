name: post
on:
  schedule:
    # Время в UTC: проверка два раза в час с 09:00 до 22:59 по Москве.
    # Минуты не круглые: запуски на начало часа GitHub часто задерживает или теряет.
    # Бот сам выбирает случайный интервал между постами: от 1 до 3 часов.
    - cron: "7,37 6-19 * * *"
  # Расписание GitHub не срабатывает, поэтому проверку запускает изменение tick.txt.
  push:
    branches: [main]
    paths:
      - .github/workflows/post.yml
      - tick.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
      - name: Запомнить прогресс
        run: |
          git config user.name "channel-bot"
          git config user.email "channel-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || { git commit -m "Опубликован пост"; git pull --rebase origin main; git push; }

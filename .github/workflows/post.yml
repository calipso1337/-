name: post
on:
  schedule:
    # Время в UTC: каждый час с 09:00 до 22:00 по Москве, 14 постов в день.
    - cron: "0 6-19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
      - name: Запомнить прогресс
        run: |
          git config user.name "channel-bot"
          git config user.email "channel-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || { git commit -m "Опубликован пост"; git pull --rebase origin main; git push; }

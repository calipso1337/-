name: post
# Цепочка без внешних сервисов: каждый запуск до своего поста работает админ-ботом (очередь
# из Telegram, модерация чата), в назначенную минуту публикует пост
# и запускает следующий. Если цепочка оборвалась, её перезапускает watchdog.yml
# или кнопка Run workflow.
on:
  workflow_dispatch:
    inputs:
      now:
        description: "Опубликовать следующий пост из очереди прямо сейчас"
        type: boolean
        default: false
      test:
        description: "Пробный пост из источника прямо сейчас"
        type: choice
        options: [none, hello, preview, meme, news, video, gemini_tip, gemini_screenshot, gemini_balance, gemini_poll]
        default: none

permissions:
  contents: write
  actions: write

concurrency:
  # Ручные и пробные запуски не ждут спящую цепочку.
  group: ${{ (inputs.now || inputs.test != 'none') && format('post-manual-{0}', github.run_id) || 'post-chain' }}
  cancel-in-progress: false

env:
  MANUAL: ${{ (inputs.now || inputs.test != 'none') && 'true' || 'false' }}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Админ-бот и модерация до следующего поста
        if: env.MANUAL == 'false'
        continue-on-error: true
        run: |
          git config user.name "channel-bot"
          git config user.email "channel-bot@users.noreply.github.com"
          python3 -u admin.py --until-post || python3 bot.py --sleep
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
      - name: Взять свежую очередь
        run: git pull --ff-only origin main
      - name: Установить yt-dlp (список Shorts и роликов, без скачивания)
        run: pip install -q yt-dlp
      - name: Опубликовать
        run: |
          if [ "${{ inputs.test }}" = "preview" ]; then
            python3 admin.py --preview-test USaMQE8-Jww
          elif [ "${{ inputs.test }}" = "hello" ]; then
            python3 admin.py --hello
          elif [ "${{ inputs.test }}" = "gemini_screenshot" ]; then
            pip install -q pillow "opencv-python-headless<5"
            SCREENSHOT_SHARE=1 python3 writer.py --publish tip
          elif [[ "${{ inputs.test }}" == gemini_* ]]; then
            pip install -q pillow "opencv-python-headless<5"
            python3 writer.py --publish "${TEST#gemini_}"
          elif [ "${{ inputs.test }}" != "none" ] && [ -n "${{ inputs.test }}" ]; then
            python3 bot.py --test "${{ inputs.test }}"
          else
            python3 bot.py
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          POST_NOW: ${{ inputs.now }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST: ${{ inputs.test }}
      - name: Запомнить прогресс
        if: always()
        run: |
          git config user.name "channel-bot"
          git config user.email "channel-bot@users.noreply.github.com"
          for file in state.json inbox.json seen.json; do [ -f "$file" ] && git add "$file"; done
          git add images 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Опубликован пост"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
      - name: Попросить Gemini дописать посты
        if: env.MANUAL == 'false'
        run: |
          left=$(python3 -c "import json;print(len(json.load(open('queue.json')))-json.load(open('state.json'))['next'])")
          echo "В очереди $left постов"
          if [ "$left" -lt 6 ] && [ -z "$(gh run list -w write.yml -s in_progress -L 1 --json databaseId -q '.[].databaseId')" ]; then
            gh workflow run write.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  next:
    needs: post
    if: always() && (github.event.inputs.now != 'true') && (github.event.inputs.test == 'none' || github.event.inputs.test == '')
    runs-on: ubuntu-latest
    steps:
      - name: Запустить следующее звено цепочки
        run: gh workflow run post.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
